# yaml-language-server: $schema=/Users/nishinohara.nozomi/.claude/hooks/gate.schema.json
rules:
  - match: "pkg/**/*.go"
    per_file_dir: true
    run:
      - name: fmt
        cmd: golangci-lint fmt
      - parallel:
          - cmd: go test ./...
            timeout: 240
          - cmd: golangci-lint run ./...
            timeout: 240
    run_checks:
      - all
  # guardrails は本体とは別の Go モジュール（guardrails/go.mod）。本体の go test / golangci-lint は
  # 入れ子のモジュールを見ないので、モジュールのディレクトリで実行する。
  - match: ["guardrails/**/*.go", "guardrails/go.mod", "guardrails/go.sum"]
    dir: guardrails
    run:
      - name: fmt
        cmd: golangci-lint fmt
      - parallel:
          - cmd: go test ./...
            timeout: 240
          - cmd: golangci-lint run ./...
            timeout: 240
  - match: "tools/extension/src/**/*.ts"
    dir: tools/extension
    run:
      - parallel:
          - cmd: pnpm test
            timeout: 180
          - cmd: pnpm typecheck
            timeout: 180
  - match: "examples/webmcp-demo/src/**/*.ts"
    dir: examples/webmcp-demo
    run:
      - cmd: pnpm typecheck
        timeout: 180
  # depgraph: このセッションで増えた設計上の負債（循環 import・層違反・重複など）を検出する。
  # 設定は .depgraph.yml、Neo4j は compose.yaml の neo4j（`mise run neo4j`）。
  # 接続先（NEO4J_URI など）は mise.toml の [env] にあり hook には渡らないので、mise exec 経由で呼ぶ。
  # mise / depgraph が無いとき、Neo4j が動いていない・未スキャンのときは何もせず通る。
  # depgraph は mise で入れる（mise.toml）。未インストールなら mise which で先に抜ける。また mise exec は足りない mise 管理ツールを
  # 自動で入れようとし、その失敗で depgraph を呼ばずに落ちるので、MISE_EXEC_AUTO_INSTALL=0 で止める（[env] は読む）。
  # timeout は depgraph gate 自身の --timeout（60s、超えたら通す）より長くし、
  # gate 側の強制終了で失敗扱いにならないようにする。
  - match: ["**/*.go", "**/*.{ts,tsx,js,jsx,mjs,cjs}", "**/*.py", ".depgraph.yml"]
    timeout: 90
    run:
      - name: depgraph
        cmd: "command -v mise >/dev/null || exit 0; mise which depgraph >/dev/null 2>&1 || exit 0; MISE_EXEC_AUTO_INSTALL=0 mise exec -- depgraph gate"
session_start:
  # 起動時に depgraph の Findings の要約を context に入れ、depgraph gate の基準（baseline）を記録する。
  # これがあると depgraph プラグインの SessionStart hook は何もしない（二重に入れない）。プロンプトごとの差分は .claude/settings.json の hook が入れる。
  - name: depgraph
    timeout: 10
    cmd: "command -v mise >/dev/null || exit 0; mise which depgraph >/dev/null 2>&1 || exit 0; MISE_EXEC_AUTO_INSTALL=0 mise exec -- depgraph hook session-start --format text"
consistency_checks:
  - name: all
    run:
      - parallel:
          - cmd: TEST=true make test
            timeout: 600
          - cmd: golangci-lint run ./...
            timeout: 600
