# yaml-language-server: $schema=/Users/nishinohara.nozomi/.claude/hooks/gate.schema.json
rules:
  - match: "pkg/**/*.go"
    per_file_dir: true
    run:
      - name: fmt
        cmd: golangci-lint fmt
      - parallel:
          - cmd: go test ./...
            timeout: 240
          - cmd: golangci-lint run ./...
            timeout: 240
    run_checks:
      - all
  - match: "tools/extension/src/**/*.ts"
    dir: tools/extension
    run:
      - parallel:
          - cmd: pnpm test
            timeout: 180
          - cmd: pnpm typecheck
            timeout: 180
  - match: "examples/webmcp-demo/src/**/*.ts"
    dir: examples/webmcp-demo
    run:
      - cmd: pnpm typecheck
        timeout: 180
  # depgraph: このセッションで増えた設計上の負債（循環 import・重複関数など）を検出する。
  # `depgraph watch` が動いていないとき・depgraph が無いときは何もせず通る。
  # timeout は depgraph gate 自身の --timeout（60s、超えたら通す）より長くし、
  # gate 側の強制終了で失敗扱いにならないようにする。
  - match: ["**/*.go", "**/*.{ts,tsx,js,jsx,mjs,cjs}", "**/*.py"]
    timeout: 90
    run:
      - { name: depgraph, cmd: "command -v depgraph >/dev/null || exit 0; depgraph gate" }
session_start:
  # 起動時に depgraph の Findings の要約を context に入れ、depgraph gate の基準（baseline）を記録する。
  - name: depgraph
    timeout: 10
    cmd: "command -v depgraph >/dev/null || exit 0; depgraph hook session-start --format text"
consistency_checks:
  - name: all
    run:
      - parallel:
          - cmd: TEST=true make test
            timeout: 600
          - cmd: golangci-lint run ./...
            timeout: 600
