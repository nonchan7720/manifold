name: Release please

on:
  push:
    branches:
      - main
      - release/v[0-9]* # Something like release/v1, release/v1.0 release/v1.0.0

permissions:
  contents: write
  pull-requests: write
  actions: write
  packages: write
  id-token: write

env:
  IMAGE_NAME: manifold

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      all: ${{ toJSON(steps.release.outputs) }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_PEM }}
          owner: ${{ github.repository_owner }}
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please/config.json
          manifest-file: release-please/manifest.json
          target-branch: ${{ github.ref_name }}
  set-tag-name:
    needs: release-please
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.output_tag.outputs.tag }}
    env:
      IS_RELEASED: ${{ needs.release-please.outputs.release_created }}
    steps:
      - name: tag name to release tag name
        if: env.IS_RELEASED == 'true'
        run: |
          echo "VERSION=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_ENV"
      - name: tag name to release tag name
        if: env.IS_RELEASED != 'true'
        run: |
          echo "VERSION=${{ github.sha }}" >> "$GITHUB_ENV"
      - name: output release tag name
        id: output_tag
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "## Tag version"
            printf '`%s`\n' "${VERSION}"
          } >> "${GITHUB_STEP_SUMMARY}"
  docker-build:
    needs:
      - release-please
      - set-tag-name
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    env:
      IS_RELEASED: ${{ needs.release-please.outputs.release_created }}
      VERSION: ${{ needs.set-tag-name.outputs.tag }}
      PLATFORM: ${{ matrix.platform == 'linux/amd64' && 'amd64' || matrix.platform == 'linux/arm64' && 'arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: AWS of Public ECR accounts
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ env.PLATFORM }}
            ${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ env.PLATFORM }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ env.PLATFORM }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ env.PLATFORM }}
  combine-multi-arch-image:
    needs:
      - docker-build
      - set-tag-name
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.set-tag-name.outputs.tag }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Enable buildx
        shell: bash
        run: docker buildx install
      - name: Log in ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: AWS of Public ECR accounts
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public
      - parallel:
          - name: Create and push multi-arch manifest to GHCR
            shell: bash
            env:
              REGISTRY: ghcr.io/${{ github.repository_owner }}
            run: |
              IMAGE="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
              docker buildx imagetools create \
                -t "$IMAGE" \
                "$IMAGE-amd64" \
                "$IMAGE-arm64"
          - name: Create and push multi-arch manifest to ECR
            shell: bash
            env:
              REGISTRY: ${{ secrets.ECR_REGISTRY }}
            run: |
              IMAGE="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
              docker buildx imagetools create \
                -t "$IMAGE" \
                "$IMAGE-amd64" \
                "$IMAGE-arm64"

  publish-mcp-registry:
    needs:
      - release-please
      - set-tag-name
      - combine-multi-arch-image
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication to the MCP Registry
      contents: read
    env:
      TAG: ${{ needs.set-tag-name.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Set release version in server.json
        run: |
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${TAG}"
          jq --arg v "$VERSION" --arg img "$IMAGE" \
            '.version = $v | .packages[0].identifier = $img' \
            server.json > server.tmp && mv server.tmp server.json
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

  goreleaser:
    runs-on: ubuntu-latest
    needs: release-please
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.sha }}
      - name: Create prerelease tag
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        run: |
          BASE=$(jq -r '."."' release-please/manifest.json)
          SHORT_SHA=$(git rev-parse --short HEAD)
          git tag "v${BASE}-dev.${SHORT_SHA}"
      - name: Setup app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_PEM }}
          owner: ${{ github.repository_owner }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run GoReleaser (Stable)
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: Run GoReleaser (Prerelease)
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean --config .goreleaser.prerelease.yaml
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
