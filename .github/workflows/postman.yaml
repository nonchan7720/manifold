name: Postman E2E

# End-to-end run of tool filtering, tool authorization and the audit log with the
# Postman CLI against a locally built gateway (tests/postman/run.sh).
on:
  pull_request:
  workflow_dispatch:

jobs:
  postman:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tools # go and the Postman CLI (postman-cli in mise.toml)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # Skip golangci-lint (built from source), setup-envtest, etc.
          install_args: "go postman-cli"
      - name: Run the Postman collection
        run: tests/postman/run.sh
      - name: Show logs
        if: failure()
        run: |
          for f in tests/postman/tmp/gateway.log tests/postman/tmp/stub.log tests/postman/tmp/audit.jsonl; do
            echo "::group::$f"; cat "$f" 2>/dev/null || true; echo "::endgroup::"
          done
