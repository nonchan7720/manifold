desc: Result filtering (tools.resultFilter) - callers pass a JMESPath expression and get back only the fields it selects
runners:
  req: ${BASE_URL:-http://127.0.0.1:19999}
vars:
  # Shared request headers; every step merges these with <<: and adds or
  # overrides what it needs. SSE responses are decoded in each test with
  #   let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"))
  mcp: &mcp
    Content-Type: application/json
    Accept: application/json, text/event-stream
    MCP-Protocol-Version: "2025-06-18"
    Authorization: Bearer runn-token
  operators: &operators
    x-user-id: user-001
    x-user-groups: operators
  readers: &readers
    x-user-id: user-001
    x-user-groups: readers
steps:
  list_advertises_the_argument:
    desc: "tools/list adds _jmespath to the tools resultFilter.include matches by their original name, and tells which syntax each tool accepts and which fields its result has (from the spec's response definition)"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 31, method: tools/list}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      let filterable = map(filter(rpc.result.tools, "_jmespath" in keys(.inputSchema.properties ?? {})), {.name});
      let get_pet = filter(rpc.result.tools, .name == "get_pet")[0].inputSchema.properties;
      let by_status = filter(rpc.result.tools, .name == "findpetsbystatus")[0].inputSchema.properties;
      let pet = "category{id, name}, id, name, photoUrls[], status, tags[]{id, name}";
      current.res.status == 200
      && rpc.error == nil
      && sort(filterable) == ["findpetsbystatus", "findpetsbytags", "get_pet"]
      && get_pet._jmespath.type == "string"
      && "petId" in keys(get_pet)
      && get_pet._jmespath.description contains "Supported: field selection. Not supported: [?conditions], [index], slices, functions."
      && by_status._jmespath.description contains "Supported: field selection, [?conditions], [index] and [start:stop] slices. Not supported: functions."
      && get_pet._jmespath.description endsWith " Result fields: " + pet + "."
      && by_status._jmespath.description endsWith " Result fields: items[]{" + pet + "}."
      && all(rpc.result.tools, ._meta == nil)
  filter_a_list:
    desc: "On a tool with conditions enabled, the expression filters and reshapes the items; the rest of the arguments still reach the backend"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 32, method: tools/call, params: {name: findpetsbystatus, arguments: {status: sold, _jmespath: "items[?status=='sold'].{id: id, name: name}"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      current.res.status == 200
      && rpc.error == nil
      && rpc.result.isError != true
      && rpc.result.content[0].text == '[{"id":1,"name":"doggie"}]'
      && keys(rpc.result.structuredContent) == ["result"]
      && rpc.result.structuredContent.result[0].name == "doggie"
  filter_an_object:
    desc: "Selecting fields needs no feature: an object result comes back as text and as structuredContent, without the fields that were not selected"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 33, method: tools/call, params: {name: get_pet, arguments: {petId: 7, _jmespath: "{id: id, name: name}"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      current.res.status == 200
      && rpc.error == nil
      && rpc.result.isError != true
      && rpc.result.content[0].text == '{"id":7,"name":"doggie"}'
      && sort(keys(rpc.result.structuredContent)) == ["id", "name"]
      && rpc.result.structuredContent.id == 7
      && rpc.result.structuredContent.name == "doggie"
  slice:
    desc: "On a tool with indexing enabled, a slice limits how many items come back"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 34, method: tools/call, params: {name: findpetsbystatus, arguments: {status: available, _jmespath: "items[:1].name"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      rpc.error == nil
      && rpc.result.isError != true
      && rpc.result.content[0].text == '["doggie"]'
  without_the_argument_nothing_changes:
    desc: "A call without _jmespath returns the whole result"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 35, method: tools/call, params: {name: findpetsbystatus, arguments: {status: available}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      let body = fromJSON(rpc.result.content[0].text);
      rpc.error == nil
      && rpc.result.isError != true
      && sort(keys(body.items[0])) == ["id", "name", "status"]
      && body.items[0].status == "available"
      && rpc.result.structuredContent.items[0].status == "available"
  null_describes_the_result:
    desc: "An expression that returns null gets the shape of the result, so it can be fixed without fetching everything"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 36, method: tools/call, params: {name: findpetsbystatus, arguments: {status: available, _jmespath: "pets[].id"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      rpc.error == nil
      && rpc.result.isError != true
      && rpc.result.content[0].text == "null"
      && rpc.result.content[1].text == "_jmespath returned null. The result is an object with keys: items."
      && rpc.result.structuredContent.result == nil
      && rpc.result.structuredContent.hint == "_jmespath returned null. The result is an object with keys: items."
  invalid_expression_is_a_tool_error:
    desc: "A syntax error is reported as a tool error the caller can read"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 37, method: tools/call, params: {name: findpetsbystatus, arguments: {status: sold, _jmespath: "items[?id = `1`]"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      current.res.status == 200
      && rpc.error == nil
      && rpc.result.isError == true
      && rpc.result.content[0].text == "invalid _jmespath: unexpected '=' (use '==' to compare) at offset 10. The tool was not called."
  functions_are_not_supported:
    desc: "An expression can select and filter, not compute: a function is rejected before the call"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 38, method: tools/call, params: {name: findpetsbystatus, arguments: {status: sold, _jmespath: "length(items)"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      rpc.error == nil
      && rpc.result.isError == true
      && rpc.result.content[0].text == "invalid _jmespath: functions are not supported (length()): an expression can only select and filter at offset 0. The tool was not called."
  condition_on_a_tool_without_the_feature:
    desc: "get_pet is not listed in features.conditions: [?...] is rejected before the call"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 42, method: tools/call, params: {name: get_pet, arguments: {petId: 7, _jmespath: "tags[?name == 'a']"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      rpc.error == nil
      && rpc.result.isError == true
      && rpc.result.content[0].text == "invalid _jmespath: \"[?\" cannot be used: filtering by a condition ([?...] with comparison and logical operators) is not enabled at offset 4. The tool was not called."
  index_on_a_tool_without_the_feature:
    desc: "findpetsbytags is not listed in features.indexing: an index is rejected before the call"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 43, method: tools/call, params: {name: findpetsbytags, arguments: {tags: [a], _jmespath: "items[0]"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      rpc.error == nil
      && rpc.result.isError == true
      && rpc.result.content[0].text == "invalid _jmespath: indexes and slices ([0], [:5]) are not enabled at offset 5. The tool was not called."
  tool_outside_the_filter_ignores_the_argument:
    desc: "getinventory is not in resultFilter.include: _jmespath is not advertised and does not filter"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *operators]
          body:
            application/json:
              {jsonrpc: "2.0", id: 39, method: tools/call, params: {name: getinventory, arguments: {_jmespath: "available"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      let body = fromJSON(rpc.result.content[0].text);
      rpc.error == nil
      && rpc.result.isError != true
      && body.available == 3
      && body.sold == 1
  authz_still_applies:
    desc: "readers may call get_pet with an expression, but not a tool the policy denies"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *readers]
          body:
            application/json:
              {jsonrpc: "2.0", id: 40, method: tools/call, params: {name: get_pet, arguments: {petId: 7, _jmespath: "name"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      rpc.error == nil
      && rpc.result.isError != true
      && rpc.result.content[0].text == '"doggie"'
  authz_denies_before_the_filter:
    desc: "A denied tool stays denied whatever the expression"
    req:
      /mcp/petstore:
        post:
          headers:
            <<: [*mcp, *readers]
          body:
            application/json:
              {jsonrpc: "2.0", id: 41, method: tools/call, params: {name: findpetsbytags, arguments: {tags: [a], _jmespath: "items[].id"}}}
    test: |
      let rpc = fromJSON(trimPrefix(filter(split(current.res.rawBody, "\n"), hasPrefix(#, "data:"))[0], "data:"));
      rpc.result == nil
      && rpc.error.message == "tool not allowed by policy"
