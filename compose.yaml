services:
  # redis:
  #   image: redis:7.4.2-alpine
  #   ports:
  #     - "${REDIS_PORT:-6379}:6379"
  #   volumes:
  #     - redis_data:/data

  otel:
    image: grafana/otel-lgtm:0.39.0@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # depgraph（依存グラフの解析）の保存先。接続先は mise.toml の [env]。
  # ポートは depgraph 本体（7474/7687）や他リポジトリの Neo4j と重ならないようずらす。
  # profiles により `docker compose up -d` では起動しない（`mise run neo4j` で名前を指定して起動する）。
  neo4j:
    profiles: ["depgraph"]
    image: neo4j:5.26.32@sha256:42ef3ebfd671ebd01fdebb6dcbe80cf7b45eef2aa3d346ef4132f7ef31e67d2f
    container_name: manifold-neo4j
    ports:
      - "127.0.0.1:27474:7474" # browser UI
      - "127.0.0.1:27687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/manifold123
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis_data:
  neo4j_data:
