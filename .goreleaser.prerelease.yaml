version: 2

project_name: manifold

before:
  hooks:
    - go mod tidy

builds:
  - id: manifold
    binary: manifold
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./main.go

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  prerelease: true
  # タグはローカルで作るだけで push しないので、GoReleaser がリリースを作るときに GitHub 側でタグが作られる。
  # target_commitish を省くとそのタグはデフォルトブランチの「その時点の先頭」に付く。連続でマージされると
  # 複数の dev タグが最新コミットに集まり、最新コミットのジョブが別のタグ（既にアセットがあるリリース）を
  # 選んで 422 already_exists で落ちるため、ビルドしたコミットを明示する。
  target_commitish: "{{ .Commit }}"
